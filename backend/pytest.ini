[pytest]
testpaths = tests
pythonpath = .
addopts = -v -ra --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
markers =
    unit: Pure unit tests without database interaction.
    integration: Integration tests with isolated in-memory persistence.
